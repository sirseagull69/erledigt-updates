# Macht aus einem Upload-Tag (upload-2.6.6) ein GitHub-Release mit den Dateien aus release/.
# Grund: Claude-Cloud-Sitzungen dürfen keine Releases anlegen, Tags pushen aber schon.
# Danach wird der Upload-Tag wieder gelöscht – die Installer landen so nie dauerhaft in der Git-History.
name: Release
on:
  push:
    tags: ["upload-*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${GITHUB_REF_NAME#upload-}"
          ls -la release
          gh release delete "v$V" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          gh release create "v$V" release/* --repo "$GITHUB_REPOSITORY" --target main --latest \
            --title "Erledigt $V" --notes "Windows: Erledigt-Setup-$V.exe · Mac (Apple-Chip): Erledigt-mac-arm64-$V.zip"
      - name: Upload-Tag aufräumen
        if: always()
        run: git push origin ":refs/tags/${GITHUB_REF_NAME}"
